<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Editor</title>
  <meta name="theme-color" content="#0f1226">
  <link rel="icon" href="icons/icon32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="recorder.css">
  <link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="app-theme.css">
</head>
<body data-title="title.editor">
  <header class="top">
    <span class="tally" aria-hidden="true"></span>
    <h1 data-i18n="title.editor">Video Editor</h1>
    <p data-i18n="ed.tagline">Trim, cut, crop, speed up and add text. Free, offline, no watermark.</p>
    <div class="topbar">
      <a class="nav" href="recorder.html" data-i18n="nav.recorder">Back to recorder</a>
      <button class="nav" id="langBtn" type="button" data-i18n="nav.lang">العربية</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Preview and timeline">
      <div class="screen has-canvas" id="screen">
        <canvas id="view" width="960" height="540"></canvas>
        <div class="empty" id="empty">
          <p class="empty-title" data-i18n="ed.empty.title">No video loaded</p>
          <p data-i18n="ed.empty.drop">Drop a video here, or</p>
          <button class="ghost open" id="openBtn" type="button" data-i18n="ed.open">Open a video file</button>
        </div>
      </div>
      <input type="file" id="fileInput" accept="video/*" hidden>

      <div class="transport">
        <button class="tool play" id="playBtn" type="button" disabled data-i18n="play">Play</button>
        <div class="clock"><span id="curTime">00:00.0</span><span class="of" data-i18n="of">of</span><span id="totTime">00:00.0</span></div>
        <div class="spacer"></div>
        <button class="tool" id="undoBtn" type="button" disabled data-i18n="undo">Undo</button>
        <button class="tool" id="resetBtn" type="button" disabled data-i18n="reset">Reset cuts</button>
      </div>

      <div class="timeline" id="tl" aria-label="Timeline"></div>
      <div class="tl-tools">
        <button class="tool" id="splitBtn" type="button" disabled data-i18n="split">Split at playhead</button>
        <button class="tool danger" id="delBtn" type="button" disabled data-i18n="delpart">Delete selected part</button>
        <p class="hint" data-i18n="tl.hint"></p>
      </div>
    </section>

    <aside class="panel" aria-label="Editor controls">
      <div class="actions">
        <button class="primary" id="exportBtn" type="button" disabled data-i18n="export">Export video</button>
        <button class="secondary" id="cancelBtn" type="button" hidden data-i18n="export.cancel">Cancel export</button>
        <div class="progress" id="progress" hidden><div class="progress-bar" id="progBar"></div></div>
        <p class="msg" id="msg" role="status"></p>
        <div class="result" id="result" hidden>
          <h2 data-i18n="ed.ready">Edited video ready</h2>
          <a class="primary link" id="download" download data-i18n="ed.download">Download video</a>
        </div>
      </div>

      <div class="settings" id="settings">
        <section class="sec">
          <h2 data-i18n="sec.clip">Clip</h2>
          <div class="field">
            <label for="speed" data-i18n="speed">Speed</label>
            <select id="speed">
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected data-i18n="speed.1">1x (normal)</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
              <option value="3">3x</option>
              <option value="4">4x</option>
            </select>
          </div>
          <div class="field">
            <label for="volume"><span data-i18n="volume">Volume</span> <span id="volLabel">100%</span></label>
            <input type="range" id="volume" min="0" max="200" value="100">
          </div>
        </section>

        <section class="sec">
          <h2 data-i18n="sec.frame">Frame</h2>
          <div class="field">
            <label for="aspect" data-i18n="aspect">Shape</label>
            <select id="aspect">
              <option value="orig" selected data-i18n="asp.orig">Original</option>
              <option value="16:9" data-i18n="asp.169">Wide 16:9</option>
              <option value="1:1" data-i18n="asp.11">Square 1:1</option>
              <option value="9:16" data-i18n="asp.916">Vertical 9:16</option>
              <option value="4:5" data-i18n="asp.45">Portrait 4:5</option>
            </select>
          </div>
          <div class="field">
            <label for="zoom"><span data-i18n="zoom">Zoom</span> <span id="zoomLabel">100%</span></label>
            <input type="range" id="zoom" min="100" max="300" value="100">
          </div>
          <div class="field">
            <label for="panX" data-i18n="panx">Move left/right</label>
            <input type="range" id="panX" min="-100" max="100" value="0">
          </div>
          <div class="field">
            <label for="panY" data-i18n="pany">Move up/down</label>
            <input type="range" id="panY" min="-100" max="100" value="0">
          </div>
        </section>

        <section class="sec">
          <h2 data-i18n="sec.text">Text</h2>
          <button class="ghost" id="addText" type="button" disabled data-i18n="addtext">Add text at playhead</button>
          <div class="texts" id="textList"></div>
        </section>

        <section class="sec">
          <h2 data-i18n="sec.export">Export</h2>
          <div class="field">
            <label for="res" data-i18n="res">Resolution</label>
            <select id="res">
              <option value="orig" selected data-i18n="res.orig">Same as original</option>
              <option value="1080" data-i18n="res.1080">Up to 1080p</option>
              <option value="720" data-i18n="res.720">Up to 720p</option>
              <option value="480" data-i18n="res.480">Up to 480p</option>
            </select>
          </div>
          <div class="field">
            <label for="format" data-i18n="format">Format</label>
            <select id="format"></select>
          </div>
          <p class="hint" data-i18n="ed.hint"></p>
        </section>
      </div>
    </aside>
  </main>

  <script src="i18n.js"></script><script src="app-ui.js"></script>
  <script src="pwa.js"></script>
  <script src="clipstore.js"></script>
  <script src="editor.js"></script>
</body>
</html>
