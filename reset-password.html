<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090d1b">
  <title>Reset password · ScreenStudio</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="shell">
    <a class="brand" href="index.html">● Screen<span>Studio</span></a>
    <div class="tools">
      <button id="lang" type="button">العربية</button>
      <button id="theme" type="button">☀️</button>
    </div>
    <section class="card">
      <div class="mark">S</div>
      <p class="eyebrow" id="eyebrow">YOUR CREATION WORKSPACE</p>
      <h1 id="heading">Choose a new password</h1>
      <p class="muted" id="subtitle">Enter and confirm your new password below.</p>
      <form id="form">
        <label for="password" id="passwordLabel">New password</label>
        <input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters">
        <label for="confirm" id="confirmLabel">Confirm new password</label>
        <input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter your password again">
        <button class="submit" id="submit" type="submit">Update password</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="switch"><a id="signin" href="auth.html" style="color:#b1a8ff;text-decoration:none">Back to sign in</a></p>
    </section>
    <a class="back" id="back" href="index.html">← Back to home</a>
  </main>
  <script src="auth-config.js"></script>
  <script type="module" src="reset-password.js"></script>
</body>
</html>
