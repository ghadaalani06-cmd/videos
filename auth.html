<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1b"><title>Account · ScreenStudio</title><link rel="icon" href="icons/icon32.png"><link rel="stylesheet" href="auth.css"></head><body><main class="shell"><a class="brand" href="index.html">● Screen<span>Studio</span></a><div class="tools"><button id="lang" type="button">العربية</button><button id="theme" type="button">☀️</button></div><section class="card"><div class="mark">S</div><p class="eyebrow" data-t="eyebrow">YOUR CREATION WORKSPACE</p><h1 id="heading">Welcome back</h1><p id="subtitle" class="muted">Sign in to continue to ScreenStudio.</p><div class="tabs"><button id="inTab" class="active" type="button">Sign in</button><button id="upTab" type="button">Create account</button></div><form id="form"><div id="nameWrap" hidden><label for="name" data-t="name">Full name</label><input id="name" autocomplete="name"></div><label for="email" data-t="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password" data-t="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"><div id="confirmWrap" hidden><label for="confirm" data-t="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password"></div><button id="forgot" class="forgot" type="button">Forgot password?</button><button id="submit" class="submit" type="submit">Sign in</button></form><p id="status" role="status" aria-live="polite"></p><p class="switch"><span id="switchText">New to ScreenStudio?</span> <button id="switch" type="button">Create account</button></p><p class="fine" data-t="fine">By continuing, you agree to use ScreenStudio responsibly.</p></section><a class="back" id="back" href="index.html">← Back to home</a></main><script src="auth-config.js"></script><script type="module" src="auth.js"></script></body></html>
